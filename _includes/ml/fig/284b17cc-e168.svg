<svg viewBox="0 0 760 428" role="img" aria-label="은닉층으로 XOR을 푸는 다층 퍼셉트론" font-size="12.5"><defs><marker id="f284b17-mlp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">은닉층에 퍼셉트론 2개(NAND, OR)를 두고 출력에서 AND로 합치면 XOR이 풀림</text><g data-claude-anchor="hidden-box"><rect x="300" y="60" width="150" height="290" rx="8" fill="none" stroke="var(--cds-text-secondary)" stroke-width="1.25" stroke-dasharray="6 4"></rect></g><g data-claude-anchor="connectors" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M114 120H334" marker-end="url(#f284b17-mlp-arrow)"></path><path d="M114 280H334" marker-end="url(#f284b17-mlp-arrow)"></path><path d="M110 134L338 268" marker-end="url(#f284b17-mlp-arrow)"></path><path d="M110 266L338 132" marker-end="url(#f284b17-mlp-arrow)"></path><path d="M384 128L604 192" marker-end="url(#f284b17-mlp-arrow)"></path><path d="M384 272L604 208" marker-end="url(#f284b17-mlp-arrow)"></path></g><g data-claude-anchor="weights" font-size="12" font-weight="600" fill="var(--cds-chart-categorical-1)"><text data-claude-text-id="w11" x="224" y="110" text-anchor="middle">w₁₁</text><text data-claude-text-id="w12" x="176" y="160">w₁₂</text><text data-claude-text-id="w21" x="176" y="254">w₂₁</text><text data-claude-text-id="w22" x="224" y="298" text-anchor="middle">w₂₂</text><text data-claude-text-id="w31" x="500" y="144" text-anchor="middle">w₃₁</text><text data-claude-text-id="w32" x="500" y="266" text-anchor="middle">w₃₂</text></g><g data-claude-anchor="inputs"><circle cx="90" cy="120" r="24" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text data-claude-text-id="x1" x="90" y="125" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">x₁</text><circle cx="90" cy="280" r="24" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text data-claude-text-id="x2" x="90" y="285" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">x₂</text><text data-claude-text-id="in-label" x="90" y="372" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">입력층</text></g><g data-claude-anchor="hidden"><circle cx="360" cy="120" r="24" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text data-claude-text-id="n1" x="360" y="125" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">n₁</text><text data-claude-text-id="b1" x="360" y="84" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">+ b₁</text><text data-claude-text-id="n1-role" x="394" y="104" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">NAND</text><circle cx="360" cy="280" r="24" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text data-claude-text-id="n2" x="360" y="285" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">n₂</text><text data-claude-text-id="b2" x="360" y="326" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">+ b₂</text><text data-claude-text-id="n2-role" x="394" y="306" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">OR</text><text data-claude-text-id="hid-label" x="375" y="372" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">은닉층 (점선)</text></g><g data-claude-anchor="output"><circle cx="630" cy="200" r="24" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text data-claude-text-id="y" x="630" y="205" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">y</text><text data-claude-text-id="b3" x="630" y="164" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">+ b₃</text><text data-claude-text-id="y-role" x="630" y="246" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">AND → XOR 결과</text><text data-claude-text-id="out-label" x="630" y="372" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">출력층</text></g><g data-claude-anchor="counts"><text data-claude-text-id="count1" x="24" y="402" fill="var(--cds-text-primary)">가중치 6개(w₁₁, w₁₂, w₂₁, w₂₂, w₃₁, w₃₂) + 바이어스 3개(b₁, b₂, b₃)</text><text data-claude-text-id="count2" x="24" y="420" font-size="11.5" fill="var(--cds-text-secondary)">입력 100개 × 은닉 노드 100개면 그 사이 가중치만 1만 개 → 층이 늘수록 기하급수적으로 증가</text></g></svg>
