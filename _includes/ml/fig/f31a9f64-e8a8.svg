<svg viewBox="0 0 760 340" role="img" aria-label="경계선의 어느 쪽에 놓이느냐로 새 환자의 생존을 예측" font-size="12.5"><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">경계선의 어느 쪽에 놓이느냐로 새 환자의 생존을 예측</text><g data-claude-anchor="axes" stroke="var(--cds-chart-axis)" stroke-width="1.25"><line x1="60" y1="50" x2="60" y2="310"></line><line x1="60" y1="310" x2="470" y2="310"></line></g><text data-claude-text-id="x-name" x="470" y="330" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">환자 정보 ①</text><text data-claude-text-id="y-name" x="66" y="60" font-size="11.5" fill="var(--cds-text-secondary)">환자 정보 ②</text><g data-claude-anchor="dead-points"><circle cx="140" cy="150" r="6" fill="var(--cds-chart-muted)"></circle><circle cx="180" cy="110" r="6" fill="var(--cds-chart-muted)"></circle><circle cx="220" cy="160" r="6" fill="var(--cds-chart-muted)"></circle><circle cx="130" cy="200" r="6" fill="var(--cds-chart-muted)"></circle><circle cx="250" cy="100" r="6" fill="var(--cds-chart-muted)"></circle><circle cx="200" cy="200" r="6" fill="var(--cds-chart-muted)"></circle><circle cx="160" cy="240" r="6" fill="var(--cds-chart-muted)"></circle><circle cx="110" cy="120" r="6" fill="var(--cds-chart-muted)"></circle></g><g data-claude-anchor="alive-points"><circle cx="300" cy="250" r="6" fill="var(--cds-chart-categorical-1)"></circle><circle cx="350" cy="220" r="6" fill="var(--cds-chart-categorical-1)"></circle><circle cx="400" cy="270" r="6" fill="var(--cds-chart-categorical-1)"></circle><circle cx="420" cy="180" r="6" fill="var(--cds-chart-categorical-1)"></circle><circle cx="280" cy="290" r="6" fill="var(--cds-chart-categorical-1)"></circle><circle cx="380" cy="150" r="6" fill="var(--cds-chart-categorical-1)"></circle><circle cx="450" cy="230" r="6" fill="var(--cds-chart-categorical-1)"></circle><circle cx="330" cy="280" r="6" fill="var(--cds-chart-categorical-1)"></circle></g><g data-claude-anchor="boundary"><line x1="100" y1="300" x2="440" y2="60" stroke="var(--cds-text-primary)" stroke-width="2"></line><text data-claude-text-id="boundary-name" x="330" y="56" font-size="12" font-weight="600" fill="var(--cds-text-primary)">경계선 (직선)</text></g><g data-claude-anchor="new-patient"><circle cx="320" cy="200" r="9" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2" stroke-dasharray="3 2"></circle><text data-claude-text-id="new-name" x="334" y="196" font-size="12" font-weight="600" fill="var(--cds-text-primary)">새 환자</text></g><g data-claude-anchor="legend"><circle cx="508" cy="86" r="6" fill="var(--cds-chart-categorical-1)"></circle><text data-claude-text-id="lg-alive" x="522" y="90" fill="var(--cds-text-primary)">생존 (1)</text><circle cx="508" cy="112" r="6" fill="var(--cds-chart-muted)"></circle><text data-claude-text-id="lg-dead" x="522" y="116" fill="var(--cds-text-primary)">사망 (0)</text><circle cx="508" cy="138" r="7" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2" stroke-dasharray="3 2"></circle><text data-claude-text-id="lg-new" x="522" y="142" fill="var(--cds-text-primary)">새 환자 → 생존 쪽이라 생존 예측</text></g><g data-claude-anchor="steps"><text data-claude-text-id="step1" x="500" y="190" fill="var(--cds-text-primary)">1. 기존 환자를 좌표에 배치</text><text data-claude-text-id="step2" x="500" y="214" fill="var(--cds-text-primary)">2. 두 무리를 가르는 경계선 긋기</text><text data-claude-text-id="step3" x="500" y="238" fill="var(--cds-text-primary)">3. 새 환자가 놓인 쪽으로 예측</text><text data-claude-text-id="hist1" x="500" y="274" font-size="11.5" fill="var(--cds-text-secondary)">경계선을 치우치지 않게 긋는 방법</text><text data-claude-text-id="hist2" x="500" y="292" font-size="11.5" fill="var(--cds-text-secondary)">→ 퍼셉트론·아달라인·선형회귀</text><text data-claude-text-id="hist3" x="500" y="310" font-size="11.5" fill="var(--cds-text-secondary)">→ 딥러닝 탄생</text></g></svg>
