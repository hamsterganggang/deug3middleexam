<svg viewBox="0 0 760 264" role="img" aria-label="정답(라벨)이 있으면 지도학습, 없으면 비지도학습" font-size="12.5"><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">정답(라벨)이 있으면 지도학습, 없으면 비지도학습</text><g data-claude-anchor="supervised"><rect x="24" y="52" width="344" height="160" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text data-claude-text-id="sup-name" x="44" y="80" font-size="15" font-weight="600" fill="var(--cds-text-primary)">지도학습</text><text data-claude-text-id="sup-1" x="44" y="106" fill="var(--cds-text-primary)">데이터 + 정답(라벨)을 함께 줌</text><text data-claude-text-id="sup-2" x="44" y="128" fill="var(--cds-text-primary)">예: 사진 A → 고양이, 사진 B → 개</text><text data-claude-text-id="sup-3" x="44" y="150" fill="var(--cds-text-primary)">예: 1 + 1 = 2 (문제 + 라벨)</text><text data-claude-text-id="sup-4" x="44" y="172" fill="var(--cds-text-primary)">정답을 맞히는 모델 · 이 교재의 주 내용</text></g><g data-claude-anchor="unsupervised"><rect x="392" y="52" width="344" height="160" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text data-claude-text-id="unsup-name" x="412" y="80" font-size="15" font-weight="600" fill="var(--cds-text-primary)">비지도학습</text><text data-claude-text-id="unsup-1" x="412" y="106" fill="var(--cds-text-primary)">데이터만 줌 (정답 없음)</text><text data-claude-text-id="unsup-2" x="412" y="128" fill="var(--cds-text-primary)">특징 학습: 개는 이렇고 고양이는 이렇더라</text><text data-claude-text-id="unsup-3" x="412" y="150" fill="var(--cds-text-primary)">지도학습보다 난이도가 높음</text><text data-claude-text-id="unsup-4" x="412" y="172" fill="var(--cds-text-primary)">예: 얼굴·목소리를 바꾸는 생성형 AI</text></g><text data-claude-text-id="nets" x="24" y="242" font-size="12" fill="var(--cds-text-secondary)">CNN(합성곱 신경망): 이미지 인식 · RNN(순환 신경망): 주식 예측 → 교재 후반부에 억게 다룸</text></svg>
