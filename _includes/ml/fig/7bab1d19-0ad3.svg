<svg viewBox="0 0 760 396" role="img" aria-label="퍼셉트론의 구조" font-size="12.5"><defs><marker id="f7bab1d-pc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">퍼셉트론 = 가중합(입력 × 가중치 + 바이어스) → 활성화 함수 → 출력</text><g data-claude-anchor="connectors" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M112 126L292 188" marker-end="url(#f7bab1d-pc-arrow)"></path><path d="M112 274L292 212" marker-end="url(#f7bab1d-pc-arrow)"></path><path d="M330 310V242" marker-end="url(#f7bab1d-pc-arrow)"></path><path d="M370 200H438" marker-end="url(#f7bab1d-pc-arrow)"></path><path d="M570 200H634" marker-end="url(#f7bab1d-pc-arrow)"></path></g><g data-claude-anchor="inputs"><circle cx="90" cy="120" r="22" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text data-claude-text-id="x1" x="90" y="125" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">x₁</text><circle cx="90" cy="280" r="22" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text data-claude-text-id="x2" x="90" y="285" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">x₂</text><text data-claude-text-id="in-label" x="90" y="334" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">입력</text></g><text data-claude-text-id="w1" x="196" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-chart-categorical-1)">× w₁</text><text data-claude-text-id="w2" x="196" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-chart-categorical-1)">× w₂</text><g data-claude-anchor="sum"><circle cx="330" cy="200" r="40" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text data-claude-text-id="sigma" x="330" y="210" text-anchor="middle" font-size="26" fill="var(--cds-text-primary)">∑</text><text data-claude-text-id="sum-name" x="330" y="140" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">가중합</text><text data-claude-text-id="sum-formula" x="330" y="116" text-anchor="middle" fill="var(--cds-text-primary)">x₁w₁ + x₂w₂ + b</text></g><g data-claude-anchor="bias"><circle cx="330" cy="330" r="20" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></circle><text data-claude-text-id="b" x="330" y="335" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">b</text><text data-claude-text-id="bias-name" x="358" y="335" font-size="11.5" fill="var(--cds-text-secondary)">바이어스 (더함)</text></g><g data-claude-anchor="activation"><rect x="440" y="172" width="130" height="56" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text data-claude-text-id="act-name" x="505" y="196" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">활성화 함수</text><text data-claude-text-id="act-rule" x="505" y="215" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">예: 0보다 크면 1</text><text data-claude-text-id="act-kinds" x="505" y="252" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">계단·시그모이드·ReLU 등</text></g><g data-claude-anchor="output"><circle cx="660" cy="200" r="24" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text data-claude-text-id="y" x="660" y="205" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">y</text><text data-claude-text-id="out-label" x="660" y="248" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">출력 (0 또는 1)</text></g><text data-claude-text-id="note" x="24" y="384" font-size="11.5" fill="var(--cds-text-secondary)">가중치 w ↔ 기울기 a, 바이어스 b ↔ 절편 b · 활성화 함수로 시그모이드를 쓰면 로지스틱 회귀와 같은 동작</text></svg>
