<svg viewBox="0 0 760 324" role="img" aria-label="딥러닝은 머신러닝 안에, 머신러닝은 인공지능 안에 있음" font-size="13"><text data-claude-text-id="title" x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">딥러닝은 머신러닝 안에, 머신러닝은 인공지능 안에 있음</text><g data-claude-anchor="ai"><rect x="24" y="52" width="712" height="252" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text data-claude-text-id="ai-name" x="44" y="80" font-size="15" font-weight="600" fill="var(--cds-text-primary)">인공지능 (AI)</text><text data-claude-text-id="ai-desc" x="44" y="100" font-size="11.5" fill="var(--cds-text-secondary)">가장 큰 범주 · 사람처럼 판단하는 기계 · 비유: 먹을 수 있는 모든 음식</text></g><g data-claude-anchor="ml"><rect x="64" y="116" width="632" height="172" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text data-claude-text-id="ml-name" x="84" y="144" font-size="15" font-weight="600" fill="var(--cds-text-primary)">머신러닝</text><text data-claude-text-id="ml-desc" x="84" y="164" font-size="11.5" fill="var(--cds-text-secondary)">데이터로 규칙을 찾아 예측 · 데이터 활용법은 사람이 수작업 · 비유: 고기 음식</text></g><g data-claude-anchor="dl"><rect x="104" y="180" width="552" height="92" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text data-claude-text-id="dl-name" x="124" y="208" font-size="15" font-weight="600" fill="var(--cds-text-primary)">딥러닝</text><text data-claude-text-id="dl-desc1" x="124" y="230" font-size="11.5" fill="var(--cds-text-primary)">머신러닝 알고리즘 중 가장 좋은 효과 · 비유: 최고급 스테이크</text><text data-claude-text-id="dl-desc2" x="124" y="250" font-size="11.5" fill="var(--cds-text-primary)">사람이 하던 수작업 부분까지 학습된 규칙으로 컴퓨터가 처리</text></g></svg>
