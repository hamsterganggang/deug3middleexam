<svg viewBox="0 0 760 380" role="img" aria-label="기울기 a는 기울어진 정도, 절편 b는 y축과 만나는 점" font-size="12.5"><text data-claude-text-id="title" x="24" y="24" font-size="15" font-weight="600" fill="var(--cds-text-primary)">기울기 a는 기울어진 정도, 절편 b는 y축과 만나는 점</text><g data-claude-anchor="grid" stroke="var(--cds-chart-grid)" stroke-width="1"><line x1="90" x2="90" y1="350" y2="44"></line><line x1="124" x2="124" y1="350" y2="44"></line><line x1="158" x2="158" y1="350" y2="44"></line><line x1="192" x2="192" y1="350" y2="44"></line><line x1="226" x2="226" y1="350" y2="44"></line><line x1="260" x2="260" y1="350" y2="44"></line><line x1="294" x2="294" y1="350" y2="44"></line><line x1="90" x2="294" y1="350" y2="350"></line><line x1="90" x2="294" y1="316" y2="316"></line><line x1="90" x2="294" y1="282" y2="282"></line><line x1="90" x2="294" y1="248" y2="248"></line><line x1="90" x2="294" y1="214" y2="214"></line><line x1="90" x2="294" y1="180" y2="180"></line><line x1="90" x2="294" y1="146" y2="146"></line><line x1="90" x2="294" y1="112" y2="112"></line><line x1="90" x2="294" y1="78" y2="78"></line><line x1="90" x2="294" y1="44" y2="44"></line></g><g data-claude-anchor="axes" stroke="var(--cds-chart-axis)" stroke-width="1.25"><line x1="90" x2="304.2" y1="350" y2="350"></line><line x1="90" x2="90" y1="350" y2="37.200000000000045"></line></g><text data-claude-text-id="x-axis" x="310.2" y="354" fill="var(--cds-text-secondary)">x</text><text data-claude-text-id="y-axis" x="82" y="48" text-anchor="end" fill="var(--cds-text-secondary)">y</text><text data-claude-text-id="tick-3" x="82" y="252" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">3</text><g data-claude-anchor="line"><line x1="90" y1="248" x2="294" y2="44" stroke="var(--cds-text-primary)" stroke-width="2"></line></g><g data-claude-anchor="intercept"><circle cx="90" cy="248" r="5" fill="var(--cds-chart-categorical-1)"></circle><text data-claude-text-id="intercept-label" x="100" y="268" font-size="12" font-weight="600" fill="var(--cds-chart-categorical-1)">절편 b = 3</text></g><g data-claude-anchor="points"><circle cx="124" cy="214" r="4" fill="var(--cds-text-primary)"></circle><circle cx="158" cy="180" r="4" fill="var(--cds-text-primary)"></circle><text data-claude-text-id="p1" x="132" y="230" font-size="11.5" fill="var(--cds-text-secondary)">(1, 4)</text><text data-claude-text-id="p2" x="166" y="196" font-size="11.5" fill="var(--cds-text-secondary)">(2, 5)</text></g><g data-claude-anchor="slope"><path d="M226 112H260V78" fill="none" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></path><text data-claude-text-id="dx" x="243" y="128" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-chart-categorical-1)">x +1</text><text data-claude-text-id="dy" x="266" y="99" font-size="11.5" font-weight="600" fill="var(--cds-chart-categorical-1)">y +1</text></g><g data-claude-anchor="explain"><text data-claude-text-id="formula" x="360" y="80" font-size="18" font-weight="600" fill="var(--cds-chart-categorical-1)">y = ax + b</text><text data-claude-text-id="ex-a" x="360" y="112" fill="var(--cds-text-primary)">a = 기울기 = y 증가량 ÷ x 증가량</text><text data-claude-text-id="ex-b" x="360" y="136" fill="var(--cds-text-primary)">b = 절편 = y축과 만나는 점</text><text data-claude-text-id="ex-1" x="360" y="172" fill="var(--cds-text-primary)">그림: x가 1 늘 때 y도 1 → a = 1</text><text data-claude-text-id="ex-2" x="360" y="196" fill="var(--cds-text-primary)">y축과 3에서 만남 → b = 3</text><text data-claude-text-id="ex-3" x="360" y="220" font-weight="600" fill="var(--cds-text-primary)">→ y = x + 3</text><text data-claude-text-id="ex-4" x="360" y="244" fill="var(--cds-text-secondary)">x = 1이면 4, x = 2이면 5</text><text data-claude-text-id="ex-5" x="360" y="290" font-weight="600" fill="var(--cds-text-primary)">딥러닝 = 원하는 y가 나오도록</text><text data-claude-text-id="ex-6" x="360" y="312" font-weight="600" fill="var(--cds-text-primary)">적절한 a와 b를 찾는 것</text></g></svg>
