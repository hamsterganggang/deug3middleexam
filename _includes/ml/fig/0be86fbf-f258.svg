<svg viewBox="0 0 760 340" role="img" aria-label="AND와 OR은 직선 하나로 나뉘지만 XOR은 나눌 수 없음" font-size="12"><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">AND와 OR은 직선 하나로 나뉘지만 XOR은 나눌 수 없음</text><g data-claude-anchor="panel-and"><path d="M70 70V240H240" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></path><circle cx="90" cy="220" r="9" fill="none" stroke="var(--cds-text-primary)" stroke-width="2"></circle><circle cx="210" cy="220" r="9" fill="none" stroke="var(--cds-text-primary)" stroke-width="2"></circle><circle cx="90" cy="100" r="9" fill="none" stroke="var(--cds-text-primary)" stroke-width="2"></circle><circle cx="210" cy="100" r="9" fill="var(--cds-chart-categorical-1)" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><line x1="234" y1="184" x2="126" y2="76" stroke="var(--cds-text-primary)" stroke-width="2"></line><text data-claude-text-id="and-head" x="70" y="60" font-size="14" font-weight="600" fill="var(--cds-text-primary)">AND</text><text data-claude-text-id="and-cap" x="70" y="268" fill="var(--cds-text-primary)">둘 다 1일 때만 1</text><text data-claude-text-id="and-ok" x="70" y="286" font-weight="600" fill="var(--cds-chart-categorical-1)">직선 하나로 가능</text></g><g data-claude-anchor="panel-or"><path d="M310 70V240H480" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></path><circle cx="330" cy="220" r="9" fill="none" stroke="var(--cds-text-primary)" stroke-width="2"></circle><circle cx="450" cy="220" r="9" fill="var(--cds-chart-categorical-1)" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><circle cx="330" cy="100" r="9" fill="var(--cds-chart-categorical-1)" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><circle cx="450" cy="100" r="9" fill="var(--cds-chart-categorical-1)" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><line x1="414" y1="244" x2="306" y2="136" stroke="var(--cds-text-primary)" stroke-width="2"></line><text data-claude-text-id="or-head" x="310" y="60" font-size="14" font-weight="600" fill="var(--cds-text-primary)">OR</text><text data-claude-text-id="or-cap" x="310" y="268" fill="var(--cds-text-primary)">하나라도 1이면 1</text><text data-claude-text-id="or-ok" x="310" y="286" font-weight="600" fill="var(--cds-chart-categorical-1)">직선 하나로 가능</text></g><g data-claude-anchor="panel-xor"><path d="M550 70V240H720" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></path><circle cx="570" cy="220" r="9" fill="none" stroke="var(--cds-text-primary)" stroke-width="2"></circle><circle cx="690" cy="220" r="9" fill="var(--cds-chart-categorical-1)" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><circle cx="570" cy="100" r="9" fill="var(--cds-chart-categorical-1)" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><circle cx="690" cy="100" r="9" fill="none" stroke="var(--cds-text-primary)" stroke-width="2"></circle><line x1="654" y1="244" x2="546" y2="136" stroke="var(--cds-chart-status-critical)" stroke-width="2" stroke-dasharray="6 4"></line><line x1="714" y1="184" x2="606" y2="76" stroke="var(--cds-chart-status-critical)" stroke-width="2" stroke-dasharray="6 4"></line><text data-claude-text-id="xor-head" x="550" y="60" font-size="14" font-weight="600" fill="var(--cds-text-primary)">XOR</text><text data-claude-text-id="xor-cap" x="550" y="268" fill="var(--cds-text-primary)">서로 다를 때만 1</text><text data-claude-text-id="xor-no" x="550" y="286" font-weight="600" fill="var(--cds-chart-status-critical)">직선 하나로 불가 → 선 2개 필요</text></g><g data-claude-anchor="legend"><circle cx="32" cy="318" r="6" fill="var(--cds-chart-categorical-1)" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></circle><text data-claude-text-id="lg-1" x="44" y="322" fill="var(--cds-text-primary)">결과 1</text><circle cx="112" cy="318" r="6" fill="none" stroke="var(--cds-text-primary)" stroke-width="2"></circle><text data-claude-text-id="lg-0" x="124" y="322" fill="var(--cds-text-primary)">결과 0</text><text data-claude-text-id="lg-axes" x="200" y="322" font-size="11.5" fill="var(--cds-text-secondary)">각 그림: 가로 x₁, 세로 x₂ (각각 0 또는 1), 네 꼭짓점이 입력 4가지</text></g></svg>
