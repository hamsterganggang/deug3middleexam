# 이론 페이지의 "무엇을 공부해야 하나요?" 팝업 내용 (교수님 출제 포인트)
# sec: 이론 페이지 섹션 id, tag: 칩으로 표시할 말(선택)
title: 무엇을 공부해야 하나요?
note: ★ = 무조건 출제 · 시험은 30문제 전후, 1~8장
chapters:
  - ch: 1장
    title: 딥러닝 시작을 위한 준비 운동
    sec: s3
    points:
      - '<span class="star">★</span> 인공지능 · 머신러닝 · 딥러닝이 어떤 <b>집합 관계</b>인지 (AI ⊃ 머신러닝 ⊃ 딥러닝)'
      - '<span class="star">★</span> 딥러닝 실행에 필요한 <b>3요소</b>: 데이터, 컴퓨터, 프로그램'
  - ch: 2장
    title: 미지를 예측하는 원리와 첫 딥러닝 코드
    sec: s4
    points:
      - '딥러닝이 하는 일, <b>일반 프로그래밍과 머신러닝의 차이</b>'
      - '<span class="star">★</span> <b>새로운 데이터를 예측</b>할 수 있다는 것이 딥러닝 (이 부분 위주로)'
      - '<span class="star">★</span> 딥러닝 개괄 단계 <b>환경 → 데이터 준비 → 구조 → 모델 실행</b>까지 충분히 학습'
      - '딥러닝 <b>데이터 구조 용어</b>'
      - '<span class="star">★</span> 텐서플로 기본 + <b>케라스</b> 모델, <b>층을 쌓아가며 고도화</b>할 수 있다는 점'
  - ch: 3장
    title: 딥러닝을 위한 기초 수학
    sec: s5
    tag: 계산 · 그래프 문제
    points:
      - '<b>기울기</b>, 간단한 <b>최솟값 계산</b> (그래프 관련 문제 나옴)'
      - '<span class="star">★</span> <b>편미분</b>이라는 용어'
      - '<span class="star">★</span> <b>시그모이드 함수</b>는 꼭 기억'
  - ch: 4장
    title: 선형회귀, 최소제곱법, 평균제곱오차
    sec: s6
    tag: 계산 문제 가능
    points:
      - '<span class="star">★</span> <b>선형회귀의 정의</b>, <b>독립변수 · 종속변수</b> 꼭 기억'
      - '<span class="star">★</span> <b>최소제곱법</b> 꼭 기억 (계산할 수 있게)'
      - '<span class="star">★</span> <b>평균제곱오차</b>(MSE, Mean Squared Error) 꼭 기억 (계산할 수 있게)'
  - ch: 5장
    title: 경사하강법, 다중 선형회귀
    sec: s7
    points:
      - '<span class="star">★</span> <b>경사하강법</b>은 잊어버리면 안 됨'
      - '<span class="star">★</span> 선형회귀는 <b>단순 · 다중</b>으로 나뉨, 두 차이점을 정확하게'
  - ch: 6장
    title: 로지스틱 회귀
    sec: s8
    points:
      - '<span class="star">★</span> 로지스틱 회귀가 무엇인지, <b>개념과 용어</b>에 익숙해지기'
      - '<span class="star">★</span> <b>어떤 함수</b>를 쓰고 <b>왜</b> 쓰는지 (시그모이드 함수)'
      - '<span class="star">★</span> 시그모이드에 이어서 <b>오차</b> (교차 엔트로피)'
      - '<b>옵티마이저</b> 설명할 때 나오는 로지스틱 회귀 용어 꼭 기억'
  - ch: 7장
    title: 퍼셉트론
    sec: s9
    points:
      - '<b>퍼셉트론</b>이 무엇인지'
      - '<span class="star">★</span> 기본적인 <b>가중합</b> (강의에서는 "합성곱 · 다중합"이라고도 부름)'
  - ch: 8장
    title: 다층 퍼셉트론
    sec: s10
    points:
      - '<span class="star">★</span> <b>다층 퍼셉트론이 왜 나왔는지</b> 기억 (단일 퍼셉트론으로 XOR을 못 풀어서)'
  - ch: 풀이
    title: 계산 문제 풀이 (①~⑬)
    sec: s12
    tag: 숫자만 바꿔 출제
    points:
      - '기울기·직선, 최솟값, 편미분, 시그모이드 값, <b>최소제곱법</b>, <b>평균제곱오차</b>, 가중합, 가중치·바이어스 개수'
