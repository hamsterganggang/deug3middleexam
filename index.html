---
layout: default
---
<section class="hero">
  <p class="eyebrow">Midterm Notes</p>
  <h1>{{ site.title }}</h1>
  <p>강의 내용을 위키처럼 정리한 <b>이론</b>과, 직접 풀어 보며 확인하는 <b>문제</b>를 과목별로 모았습니다.</p>
</section>

<div class="subject-grid">
{%- for s in site.data.subjects %}
  <article class="subject{% unless s.ready %} off{% endunless %}">
    <p class="num">{{ forloop.index | prepend: '0' }}</p>
    <h2>{{ s.name }}</h2>
    <p class="desc">{{ s.desc }}</p>
    <div class="links">
      <a class="primary" href="{{ '/' | append: s.id | append: '/theory/' | relative_url }}">이론 읽기 <span aria-hidden="true">→</span></a>
      <a href="{{ '/' | append: s.id | append: '/quiz/' | relative_url }}">문제 풀기</a>
    </div>
  </article>
{%- endfor %}
</div>
